<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clean Headers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at top, #050b1a 0%, #020617 60%);
    color: #e5e7eb;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 40px 30px 50px;
}

h1 {
    text-align: center;
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: .4px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 40px;
    font-size: 15px;
}

.grid {
    display: flex;
    gap: 28px;
    align-items: stretch;
}

.grid > .box:first-child {
    flex: 1.4;
}

.grid > .box:nth-child(2) {
    flex: 1;
}

.box {
    background: linear-gradient(180deg, #0b1224, #0a1020);
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 18px 18px 20px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02),
                0 10px 30px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
}

.box h3 {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 600;
    color: #e5e7eb;
}

textarea {
    width: 100%;
    flex: 1;
    min-height: 360px;
    background: #020617;
    color: #e5e7eb;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
}

textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 1px #3b82f6;
}

.form-group {
    margin-bottom: 22px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #e5e7eb;
    margin-bottom: 6px;
}

input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 12px;
    color: #e5e7eb;
    font-size: 14px;
}

input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 1px #3b82f6;
}

small {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: #64748b;
}

.actions {
    display: flex;
    gap: 14px;
    margin-top: auto;
    padding-top: 12px;
}

button {
    flex: 1;
    padding: 14px 0;
    font-size: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    cursor: pointer;
    background: linear-gradient(180deg, #3b82f6, #2563eb);
    color: #fff;
    font-weight: 600;
    letter-spacing: .2px;
    box-shadow: 0 4px 14px rgba(59,130,246,.35);
}

button:last-child {
    background: linear-gradient(180deg, #1e293b, #0f172a);
    box-shadow: none;
    color: #cbd5f5;
}

button:hover {
    filter: brightness(1.08);
}

.output {
    margin-top: 28px;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 40px;
}

@media (max-width: 900px) {
    .grid {
        grid-template-columns: 1fr;
    }

    textarea {
        min-height: 280px;
    }
}

</style>
</head>
<body>

<div class="container">
    <h1>CMH-9</h1>
    <div class="subtitle">Clean and modify email headers</div>

    <div class="grid">

        <div class="box">
            <h3>Input Headers</h3>
            <textarea id="input"></textarea>
        </div>

        <div class="box">
            <h3>Processing Options</h3>

            <div class="form-group">
                <label>Domain Replacement:</label>
                <input type="text" id="domain" value="[RP]" placeholder="Leave empty to remove domain entirely">
                <small>Leave empty to remove domain entirely</small>
            </div>

            <div class="form-group">
                <label>Message-ID Tag:</label>
                <input type="text" id="eid" value="[EID]">
            </div>

            <div class="actions">
                <button onclick="processHeaders()">Process</button>
                <button onclick="copyResult()">Copy</button>
            </div>
        </div>

    </div>

    <div class="box output">
        <h3>Processed Headers</h3>
        <textarea id="output" readonly></textarea>
    </div>

    <div class="footer">
       karim rachmoun © 2025 — Clean Headers Clone
    </div>
</div>

<script>
function processHeaders() {
    const lines = document.getElementById("input").value.split("\n");
    const domain = document.getElementById("domain").value.trim(); 
    const eid = document.getElementById("eid").value.trim();

    let output = [];
    let skipBlock = false;

    for (let line of lines) {

        if (skipBlock) {
            if (/^\s+/.test(line)) continue;
            skipBlock = false;
        }

        if (/^(Delivered-To:|ARC-|DKIM-Signature:|X-MSFBL:|X-Google-|X-Received:|Authentication-Results:|Received-SPF:|Received-DKIM:|Return-Path:|Sender:|x-xsSpam:)/i.test(line)) {
            skipBlock = true;
            continue;
        }

        if (
            /^\s*(b=|bh=|fh=|h=|d=|s=|t=)/i.test(line) ||
            /^[A-Za-z0-9+/]{40,}={0,2}$/.test(line)
        ) continue;

        if (line.startsWith("To:")) {
            output.push("To: [*to]");
            output.push("Cc: [*to]");
            continue;
        }

        if (line.startsWith("From:")) {
            let newFrom = line.replace(/@[^>\s]+/g, domain ? `@${domain}` : "@[RP]");
            output.push(newFrom);
            continue;
        }

        if (line.startsWith("Date:")) {
            output.push("Date: [DATE]");
            continue;
        }

        if (line.startsWith("Message-ID:")) {
            if (eid) {
                output.push(
                line.replace(/(<[^@]+)(@[^>]+>)/, `$1${eid}$2`)
        );
    } else {
        output.push(line);
    }
    continue;
}


        output.push(line);
    }

    document.getElementById("output").value = output.join("\n").trim();
}

function copyResult() {
    const out = document.getElementById("output");
    out.select();
    document.execCommand("copy");
    alert("Copied!");
}
</script>


</body>
</html>
